<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>BE guard — 零售人物</title>
<style>body{background:#111;color:#ddd;font:12px/1.7 ui-monospace,monospace;padding:16px;max-width:1100px}
h1{font-size:14px;color:#ffd23f}
.ok{color:#5ddc9a}.no{color:#e2645a}.m{color:#999;margin-left:26px;white-space:pre-wrap}</style></head>
<body><h1>第 4 階段：會咬人的 guard</h1><div id="out">跑之中…</div>
<script type="module">
try {
  const { rows } = await import('./guard-chars.js');
  window.__guard = rows;
  const bad = rows.filter(r => !r.ok).length;
  document.getElementById('out').innerHTML =
    `<div>通過 <b class="ok">${rows.length - bad}</b>　失敗 <b class="no">${bad}</b></div><br>` +
    rows.map(r => `<div class="${r.ok?'ok':'no'}">${r.ok?'✔':'✘'} ${r.id} ${r.label}</div>` +
                  `<div class="m">${String(r.msg).replace(/</g,'&lt;')}</div>`).join('');
} catch(e){
  window.__guardErr = String(e && e.stack || e);
  document.getElementById('out').textContent = 'ERROR: ' + window.__guardErr;
}
</script>
</body></html>
