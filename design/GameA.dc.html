<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
  <style>
    body { margin: 0; }
    x-dc { display: block; }
    a { color: #16183a; } a:hover { color: #ff3d6e; }
    .px  { font-family: "Press Start 2P", "Courier New", monospace; }
    .pxs { font-family: "Pixelify Sans", "Courier New", monospace; }
    .han { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    svg { shape-rendering: crispEdges; }
    .hard { border: 3px solid #16183a; box-shadow: 4px 4px 0 #16183a; }
    .car { animation: ride 6s steps(8) infinite; }
    @keyframes ride { 0%,8%{transform:translateY(0)} 46%,58%{transform:translateY(-160px)} 92%,100%{transform:translateY(0)} }
    @media (prefers-reduced-motion: reduce){ .car{ animation: none; } }
  </style>
</helmet>

<!-- 方向 A：整個變亮。井道也是明亮像素，跟首頁同一個世界。 -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #eaf6ff;">

  <!-- 頂欄 -->
  <div style="background: #fff8ea; border-bottom: 4px solid #16183a; padding: 10px 12px 8px;">
    <div style="display: flex; align-items: flex-start; gap: 10px;">
      <div>
        <div class="pxs" style="font-size: 30px; font-weight: 700; color: #12915f; line-height: 1;">$12.4K</div>
        <div class="pxs" style="font-size: 12px; color: #6b6f9e; margin-top: 3px;">$84/秒</div>
      </div>
      <div style="margin-left: auto; text-align: right;">
        <div class="pxs" style="font-size: 14px; font-weight: 700; color: #2f6fd0;">📐 3</div>
        <div class="pxs" style="font-size: 13px; color: #16183a; margin-top: 2px;">★ 3.42</div>
        <div class="pxs" style="font-size: 10.5px; color: #6b6f9e;">×1.86 票價 · ×1.27 人流</div>
      </div>
    </div>
    <div style="display: flex; gap: 6px; margin-top: 8px;">
      <div class="hard" style="width: 38px; height: 34px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px;">🏠</div>
      <div class="hard pxs" style="width: 42px; height: 34px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #16183a;">EN</div>
      <div class="hard" style="margin-left: auto; width: 38px; height: 34px; background: #ffd23f; display: flex; align-items: center; justify-content: center; font-size: 15px;">🔥</div>
      <div class="hard" style="width: 38px; height: 34px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px;">🔈</div>
    </div>
  </div>

  <div class="pxs" style="background: #dcefff; border-bottom: 3px solid #16183a; padding: 5px 12px; font-size: 12px; color: #3a3d66;">
    25 樓 · 2 井 · FIFO · 等待 5 · 週三 平常
  </div>

  <!-- 井道畫面：明亮版 -->
  <div style="position: relative; height: 372px; background: #d6ecff; border-bottom: 4px solid #16183a;">
    <svg width="390" height="372" viewBox="0 0 390 372">
      <!-- 樓層 -->
      <g>
        <rect x="0" y="330" width="286" height="38" fill="#fff8ea"/><rect x="0" y="330" width="9" height="38" fill="#3ad39a"/>
        <rect x="0" y="290" width="286" height="38" fill="#f4ecd9"/><rect x="0" y="290" width="9" height="38" fill="#3ad39a"/>
        <rect x="0" y="250" width="286" height="38" fill="#fff8ea"/><rect x="0" y="250" width="9" height="38" fill="#4ec3f0"/>
        <rect x="0" y="210" width="286" height="38" fill="#f4ecd9"/><rect x="0" y="210" width="9" height="38" fill="#4ec3f0"/>
        <rect x="0" y="170" width="286" height="38" fill="#fff8ea"/><rect x="0" y="170" width="9" height="38" fill="#4ec3f0"/>
        <rect x="0" y="130" width="286" height="38" fill="#f4ecd9"/><rect x="0" y="130" width="9" height="38" fill="#ffb02e"/>
        <rect x="0" y="90"  width="286" height="38" fill="#fff8ea"/><rect x="0" y="90"  width="9" height="38" fill="#ffb02e"/>
        <rect x="0" y="50"  width="286" height="38" fill="#f4ecd9"/><rect x="0" y="50"  width="9" height="38" fill="#a06bff"/>
        <rect x="0" y="10"  width="286" height="38" fill="#fff8ea"/><rect x="0" y="10"  width="9" height="38" fill="#a06bff"/>
      </g>
      <!-- 樓層線 -->
      <g fill="#c9c0ab">
        <rect x="9" y="328" width="277" height="2"/><rect x="9" y="288" width="277" height="2"/>
        <rect x="9" y="248" width="277" height="2"/><rect x="9" y="208" width="277" height="2"/>
        <rect x="9" y="168" width="277" height="2"/><rect x="9" y="128" width="277" height="2"/>
        <rect x="9" y="88"  width="277" height="2"/><rect x="9" y="48"  width="277" height="2"/>
      </g>
      <!-- 樓層號 -->
      <g fill="#8a8299" font-family="Pixelify Sans, monospace" font-size="13">
        <text x="16" y="354">1</text><text x="16" y="314">2</text><text x="16" y="274">3</text>
        <text x="16" y="234">4</text><text x="16" y="194">5</text><text x="16" y="154">6</text>
        <text x="16" y="114">7</text><text x="16" y="74">8</text><text x="16" y="34">9</text>
      </g>

      <!-- 等待的乘客：頭上是目的地，頭頂是耐性條 -->
      <g>
        <rect x="44" y="336" width="24" height="3" fill="#3ad39a"/>
        <rect x="52" y="341" width="9" height="9" fill="#16183a"/><rect x="54" y="350" width="5" height="11" fill="#16183a"/>
        <text x="49" y="368" fill="#16183a" font-family="Pixelify Sans, monospace" font-size="12">7</text>

        <rect x="80" y="336" width="24" height="3" fill="#ffb02e"/>
        <rect x="88" y="341" width="9" height="9" fill="#16183a"/><rect x="90" y="350" width="5" height="11" fill="#16183a"/>
        <text x="85" y="368" fill="#16183a" font-family="Pixelify Sans, monospace" font-size="12">4</text>

        <rect x="44" y="216" width="24" height="3" fill="#ff5c5c"/>
        <rect x="52" y="221" width="9" height="9" fill="#ff5c5c"/><rect x="54" y="230" width="5" height="11" fill="#ff5c5c"/>
        <text x="49" y="248" fill="#c8342f" font-family="Pixelify Sans, monospace" font-size="12">1</text>

        <rect x="44" y="96" width="24" height="3" fill="#3ad39a"/>
        <rect x="52" y="101" width="9" height="9" fill="#16183a"/><rect x="54" y="110" width="5" height="11" fill="#16183a"/>
        <text x="49" y="128" fill="#16183a" font-family="Pixelify Sans, monospace" font-size="12">2</text>
      </g>

      <!-- 收到的錢 -->
      <text x="200" y="150" fill="#12915f" font-family="Pixelify Sans, monospace" font-size="17" font-weight="700">+$96</text>

      <!-- 兩座電梯井 -->
      <rect x="292" y="0" width="46" height="372" fill="#c3d2e6"/>
      <rect x="292" y="0" width="4"  height="372" fill="#16183a"/>
      <rect x="334" y="0" width="4"  height="372" fill="#16183a"/>
      <rect x="344" y="0" width="46" height="372" fill="#c3d2e6"/>
      <rect x="344" y="0" width="4"  height="372" fill="#16183a"/>
      <g class="car">
        <rect x="298" y="322" width="34" height="34" fill="#16183a"/>
        <rect x="302" y="326" width="26" height="26" fill="#ffd23f"/>
        <rect x="313" y="330" width="4"  height="18" fill="#16183a"/>
      </g>
      <rect x="350" y="122" width="34" height="34" fill="#16183a"/>
      <rect x="354" y="126" width="26" height="26" fill="#ffd23f"/>
      <rect x="365" y="130" width="4"  height="18" fill="#16183a"/>

      <!-- 時鐘 -->
      <rect x="10" y="6" width="96" height="20" fill="#16183a"/>
      <text x="16" y="21" fill="#ffe9a8" font-family="Pixelify Sans, monospace" font-size="13">週三 09:12</text>
      <text x="112" y="21" fill="#ff5c5c" font-family="Pixelify Sans, monospace" font-size="13" font-weight="700">尖峰</text>
    </svg>
  </div>

  <!-- 底部抽屜 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 344px; background: #fff8ea; border-top: 4px solid #16183a;">
    <div style="display: flex; justify-content: center; padding: 6px 0 2px;">
      <div style="width: 44px; height: 5px; background: #16183a;"></div>
    </div>
    <div style="display: flex; border-bottom: 3px solid #16183a;">
      <div class="han" style="flex: 1; text-align: center; padding: 8px 0 6px; font-size: 13px; font-weight: 900; color: #16183a; background: #ffd23f; border-bottom: 4px solid #ff5c5c;">升級</div>
      <div class="han" style="flex: 1; text-align: center; padding: 8px 0 6px; font-size: 13px; color: #6b6f9e;">自動化</div>
      <div class="han" style="flex: 1; text-align: center; padding: 8px 0 6px; font-size: 13px; color: #6b6f9e;">藍圖</div>
      <div class="han" style="flex: 1; text-align: center; padding: 8px 0 6px; font-size: 13px; color: #6b6f9e;">圖鑑</div>
      <div class="han" style="flex: 1; text-align: center; padding: 8px 0 6px; font-size: 13px; color: #6b6f9e;">統計</div>
      <div class="han" style="flex: 1; text-align: center; padding: 8px 0 6px; font-size: 13px; color: #6b6f9e;">拆樓</div>
    </div>

    <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 9px;">
      <div class="pxs" style="display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 11.5px; color: #6b6f9e;">
        <span>速度 1.30</span><span>加速 0.66</span><span>載客 8</span><span>開門 1.64s</span><span>井 2</span>
      </div>

      <div class="pxs" style="font-size: 11px; color: #6b6f9e; letter-spacing: .1em;">招商　<span style="color:#ff5c5c">3 層空著</span></div>

      <div class="hard" style="background: #fff; padding: 8px 10px;">
        <div style="display: flex; align-items: baseline;">
          <span class="han" style="font-size: 13.5px; font-weight: 700; color: #16183a;">辦公 <b style="color:#2f6fd0">12/15</b></span>
          <span class="pxs" style="margin-left: auto; font-size: 12px; color: #6b6f9e;">3 層空著</span>
        </div>
        <div style="height: 6px; background: #e8e0cd; margin: 6px 0 4px;"><i style="display:block; height:100%; width:80%; background:#3ad39a;"></i></div>
        <div style="display: flex; gap: 7px;">
          <div style="flex: 1; border: 2px solid #16183a; background: #fffdf6; padding: 6px 7px;">
            <div class="han" style="font-size: 12px; font-weight: 700; color: #16183a;">一般辦公</div>
            <div class="pxs" style="font-size: 11px; color: #c08a1a;">$186</div>
          </div>
          <div style="flex: 1; border: 2px solid #16183a; background: #fffdf6; padding: 6px 7px;">
            <div class="han" style="font-size: 12px; font-weight: 700; color: #16183a;">會議中心</div>
            <div class="pxs" style="font-size: 11px; color: #c08a1a;">$243 · <span style="color:#e2645a">會爆量</span></div>
          </div>
        </div>
      </div>

      <div class="pxs" style="font-size: 11px; color: #6b6f9e; letter-spacing: .1em;">電梯</div>
      <div class="hard" style="background: #fff; padding: 9px 10px; display: flex; align-items: center; gap: 8px;">
        <span class="han" style="font-size: 13.5px; font-weight: 700; color: #16183a;">巡航速度 <b style="color:#2f6fd0">3</b></span>
        <span class="pxs" style="margin-left: auto; font-size: 13px; color: #c08a1a;">$84</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
