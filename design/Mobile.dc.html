<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
  <style>
    body { margin: 0; }
    x-dc { display: block; }
    a { color: #16183a; } a:hover { color: #ff3d6e; }
    .px { font-family: "Press Start 2P", "Courier New", monospace; }
    .pxs { font-family: "Pixelify Sans", "Courier New", monospace; }
    .han { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    svg { shape-rendering: crispEdges; }
    .car { animation: ride 7.5s steps(9) infinite; }
    @keyframes ride {
      0%, 6%   { transform: translateY(0); }
      44%, 56% { transform: translateY(-72px); }
      94%, 100%{ transform: translateY(0); }
    }
    .beacon { animation: blink 1.6s steps(1) infinite; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .2; } }
    .btn {
      display: flex; align-items: center; gap: 12px;
      border: 4px solid #16183a; box-shadow: 6px 6px 0 #16183a;
      cursor: pointer; text-decoration: none;
    }
    .btn:active { transform: translate(6px, 6px); box-shadow: 0 0 0 #16183a; }
    .scan {
      position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(180deg, rgba(22,24,58,.05) 0 2px, transparent 2px 4px);
    }
    @media (prefers-reduced-motion: reduce) { .car, .beacon { animation: none; } }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #bff0ff;">

  <!-- 天空 -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">
    <div style="height: 90px;  background: #bff0ff;"></div>
    <div style="height: 80px;  background: #a5e8ff;"></div>
    <div style="height: 80px;  background: #8adcfb;"></div>
    <div style="height: 90px;  background: #6fd0f7;"></div>
    <div style="flex-grow: 1;  background: #5bc6f2;"></div>
  </div>

  <svg width="76" height="76" viewBox="0 0 19 19" style="position: absolute; left: 26px; top: 62px;">
    <rect x="5" y="3" width="9" height="13" fill="#ffd23f"/>
    <rect x="3" y="5" width="13" height="9" fill="#ffd23f"/>
    <rect x="5" y="5" width="4" height="2" fill="#fff2b0"/>
    <rect x="5" y="7" width="2" height="4" fill="#fff2b0"/>
  </svg>

  <svg width="118" height="42" viewBox="0 0 22 8" style="position: absolute; right: 18px; top: 120px;">
    <rect x="4" y="2" width="13" height="3" fill="#ffffff"/>
    <rect x="2" y="5" width="18" height="2" fill="#ffffff"/>
    <rect x="8" y="0" width="8"  height="2" fill="#ffffff"/>
  </svg>

  <!-- 地面 -->
  <div style="position: absolute; left: 0; right: 0; top: 430px; bottom: 0; background: #3ad39a;"></div>
  <div style="position: absolute; left: 0; right: 0; top: 430px; height: 8px; background: #2ab887;"></div>

  <!-- 大樓 -->
  <div style="position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center;">
    <svg width="200" height="300" viewBox="0 0 80 120">
      <rect class="beacon" x="37" y="0" width="6" height="4" fill="#ff3d6e"/>
      <rect x="38" y="4" width="4" height="8" fill="#16183a"/>
      <rect x="16" y="10" width="48" height="104" fill="#16183a"/>
      <rect x="18" y="12" width="44" height="100" fill="#fff8ea"/>
      <rect x="18" y="12" width="8"  height="100" fill="#e4dcc9"/>
      <rect x="30" y="98"  width="7" height="6" fill="#3ad39a"/><rect x="40" y="98"  width="7" height="6" fill="#3ad39a"/>
      <rect x="30" y="88"  width="7" height="6" fill="#3ad39a"/><rect x="40" y="88"  width="7" height="6" fill="#fff2b0"/>
      <rect x="30" y="78"  width="7" height="6" fill="#4ec3f0"/><rect x="40" y="78"  width="7" height="6" fill="#4ec3f0"/>
      <rect x="30" y="68"  width="7" height="6" fill="#4ec3f0"/><rect x="40" y="68"  width="7" height="6" fill="#4ec3f0"/>
      <rect x="30" y="58"  width="7" height="6" fill="#ffb02e"/><rect x="40" y="58"  width="7" height="6" fill="#ffb02e"/>
      <rect x="30" y="48"  width="7" height="6" fill="#ffb02e"/><rect x="40" y="48"  width="7" height="6" fill="#fff2b0"/>
      <rect x="30" y="38"  width="7" height="6" fill="#a06bff"/><rect x="40" y="38"  width="7" height="6" fill="#a06bff"/>
      <rect x="30" y="28"  width="7" height="6" fill="#ff6fa5"/><rect x="40" y="28"  width="7" height="6" fill="#ff6fa5"/>
      <rect x="30" y="18"  width="7" height="6" fill="#ff5c5c"/><rect x="40" y="18"  width="7" height="6" fill="#ff5c5c"/>
      <rect x="50" y="12" width="12" height="100" fill="#2a2d55"/>
      <rect x="55" y="12" width="2"  height="100" fill="#3d4180"/>
      <g class="car">
        <rect x="50" y="96" width="12" height="14" fill="#16183a"/>
        <rect x="52" y="98" width="8"  height="10" fill="#ffd23f"/>
        <rect x="55" y="100" width="2" height="6"  fill="#16183a"/>
      </g>
      <rect x="32" y="102" width="14" height="10" fill="#16183a"/>
      <rect x="34" y="104" width="10" height="8"  fill="#7dd8f7"/>
      <rect x="12" y="114" width="56" height="3"  fill="#16183a" opacity=".2"/>
    </svg>
  </div>

  <!-- 內容 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
      <h1 class="px" style="margin: 0; text-align: center; font-size: 27px; line-height: 1.3; color: #16183a; text-shadow: 4px 4px 0 #ffd23f;">
        ELEVATOR<br>INC.
      </h1>
      <p class="han" style="margin: 0; text-align: center; font-size: 15px; line-height: 1.7; font-weight: 500; color: #16183a; text-wrap: pretty;">
        你經營一棟不斷長高的大樓的垂直運輸，<br>而大樓越高，你越忙不過來。
      </p>
      <div class="pxs" style="display: flex; align-items: center; gap: 8px; padding: 7px 13px; background: #16183a; color: #ffe9a8; font-size: 14px; font-weight: 600;">
        <span style="width: 8px; height: 8px; background: #3ad39a; display: block;"></span>
        50 樓 · 送達 120 · ★3.0
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div class="btn" style="background: #ff5c5c; padding: 18px 20px; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 11 11"><rect x="2" y="1" width="3" height="9" fill="#fff"/><rect x="5" y="3" width="3" height="5" fill="#fff"/><rect x="8" y="4" width="2" height="3" fill="#fff"/></svg>
        <span class="han" style="font-size: 20px; font-weight: 900; color: #fff;">繼續遊戲</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div class="btn" style="background: #fff8ea; padding: 14px 12px; justify-content: center;">
          <span class="han" style="font-size: 16px; font-weight: 700; color: #16183a;">玩法說明</span>
        </div>
        <div class="btn" style="background: #fff8ea; padding: 14px 12px; justify-content: center;">
          <span class="han" style="font-size: 16px; font-weight: 700; color: #16183a;">帳本</span>
        </div>
      </div>
      <div class="btn" style="background: #7dd8f7; padding: 14px 16px; justify-content: center;">
        <span class="han" style="font-size: 16px; font-weight: 700; color: #16183a;">更多遊戲</span>
      </div>
    </div>

    <div class="pxs" style="display: flex; justify-content: center; gap: 8px; font-size: 13px; color: #16183a; opacity: .7;">
      <a href="#">GitHub</a><span>·</span><a href="#">games.csiesheep.com</a>
    </div>
  </div>

  <div class="pxs btn" style="position: absolute; right: 16px; top: 18px; background: #fff8ea; padding: 9px 14px; font-size: 14px; font-weight: 700; color: #16183a; letter-spacing: .1em;">EN</div>

  <div class="scan"></div>
</div>
</x-dc>
</body>
</html>
