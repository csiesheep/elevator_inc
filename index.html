<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elevator Inc.</title>
<meta name="description" content="An incremental game about the vertical transport of a tower that keeps growing.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/landing.css">
</head>
<body class="landing">

<button id="lang" class="langBtn">EN</button>

<main id="land">
  <div class="hero">
    <div class="tower" aria-hidden="true">
      <div class="shaft"><div class="car"></div></div>
    </div>
    <h1>Elevator&nbsp;Inc.</h1>
    <p class="tag" data-i18n="landTagline"></p>
    <p class="save dim" id="saveLine"></p>
  </div>

  <nav class="menu">
    <button class="big" id="btnStart"></button>
    <button id="btnRules" data-i18n="btnRules"></button>
    <button id="btnLedger" data-i18n="btnLedger"></button>
    <a class="btn" href="https://games.csiesheep.com/" data-i18n="btnMore"></a>
  </nav>

  <footer class="foot dim">
    <a href="https://github.com/csiesheep/elevator_inc">GitHub</a> ·
    <a href="https://games.csiesheep.com/">games.csiesheep.com</a>
  </footer>
</main>

<div id="sheetHost"></div>
<script type="module" src="js/landing.js"></script>
</body>
</html>
