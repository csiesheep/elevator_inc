<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elevator Inc.</title>
<meta name="description" content="An incremental game about the vertical transport of a tower that keeps growing.">
<meta name="theme-color" content="#bff0ff">
<!-- favicon（#149）。7×9 的圖沒有整數倍剛好合 16×16：2× 是 14×18，高度爆 2px。
     解法是挑「佔用列 ≤ 8」或「最後一列冗餘」的角色，2× 之後零裁切／無損裁切，
     擺在一塊 #16183a 的底磚上（淺色剪影在亮色分頁列會消失，所以底磚是必要的）。
     icon.svg 一個檔覆蓋所有尺寸；180 的 PNG 給 iOS 加到主畫面。
     兩個檔由 tools/artfavicon.py 產生，**角色是暫定的，等 #149 的裁決**。 -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/landing.css">
<!-- landride.css 的 @keyframes 由 tools/landgen.py 產生（#152）。**不要手改。**
     百分比是從 B_BEATS 與每一層樓的 y 算出來的，手改一組其他四組就對不上。 -->
<link rel="stylesheet" href="css/landride.css">
</head>
<body class="landing">

<!-- 天空：滿版、固定在背後 -->
<div class="scene" aria-hidden="true">
  <div class="sky">
    <i style="background:#bff0ff"></i><i style="background:#a5e8ff"></i>
    <i style="background:#8adcfb"></i><i style="background:#6fd0f7"></i>
    <i style="background:#5bc6f2; flex-grow:1"></i>
  </div>
  <svg class="sun" viewBox="0 0 27 27">
    <rect x="7"  y="4"  width="13" height="19" fill="#ffd23f"/>
    <rect x="4"  y="7"  width="19" height="13" fill="#ffd23f"/>
    <rect x="10" y="2"  width="7"  height="2"  fill="#ffd23f"/>
    <rect x="10" y="23" width="7"  height="2"  fill="#ffd23f"/>
    <rect x="2"  y="10" width="2"  height="7"  fill="#ffd23f"/>
    <rect x="23" y="10" width="2"  height="7"  fill="#ffd23f"/>
    <rect x="7"  y="7"  width="5"  height="2"  fill="#fff2b0"/>
    <rect x="7"  y="9"  width="2"  height="5"  fill="#fff2b0"/>
  </svg>
  <svg class="cloud drift" viewBox="0 0 28 10">
    <rect x="6" y="2" width="14" height="3" fill="#ffffff"/>
    <rect x="3" y="5" width="22" height="3" fill="#ffffff"/>
    <rect x="9" y="0" width="8"  height="2" fill="#ffffff"/>
    <rect x="3" y="8" width="19" height="2" fill="#d8f2ff"/>
  </svg>
  <!-- 地面：桌機兩欄的時候 .band 不再是綠色的（它變成右欄），
       所以綠地要有一條自己的、滿版的帶子墊在後面。窄螢幕它是 0 高，不出現。 -->
  <div class="ground"></div>
</div>

<button id="lang" class="langBtn">EN</button>

<main id="land">

  <!-- 大樓站在地平線上；兩側的城市只有寬螢幕看得到 -->
  <div class="towerWrap">
    <svg class="city left" viewBox="0 0 55 32" aria-hidden="true">
      <rect x="0"  y="14" width="13" height="18" fill="#4f9fc4"/>
      <rect x="15" y="8"  width="10" height="24" fill="#5aa9c9"/>
      <rect x="27" y="18" width="14" height="14" fill="#4f9fc4"/>
      <rect x="43" y="12" width="9"  height="20" fill="#5aa9c9"/>
      <rect x="3"  y="18" width="2" height="2" fill="#bfe9f7"/><rect x="8" y="18" width="2" height="2" fill="#bfe9f7"/>
      <rect x="18" y="12" width="2" height="2" fill="#bfe9f7"/><rect x="18" y="18" width="2" height="2" fill="#bfe9f7"/>
      <rect x="31" y="22" width="2" height="2" fill="#bfe9f7"/><rect x="46" y="16" width="2" height="2" fill="#bfe9f7"/>
    </svg>

    <!-- #152：中間那棟手畫的插圖換成**真的樓**——真的樓層帶色、真的 16×8 家具小景、
         真的 7×9 小人、真的 3×5 樓層號，相機 18 秒往上跑一趟，停在四個真事件。

         ⚠ 這一格的內容（SVG 與字幕資料）由 `js/landride.js` 提供，
         而那個檔是 `python tools/landgen.py` 從 content.js / sprites.js /
         interior.js / theme.js 生出來的。**這裡不寫任何一個座標或顏色。** -->
    <div class="ride" id="ride" role="img"></div>

    <svg class="city right" viewBox="0 0 55 32" aria-hidden="true">
      <rect x="3"  y="12" width="9"  height="20" fill="#5aa9c9"/>
      <rect x="14" y="18" width="14" height="14" fill="#4f9fc4"/>
      <rect x="30" y="6"  width="10" height="26" fill="#5aa9c9"/>
      <rect x="42" y="16" width="13" height="16" fill="#4f9fc4"/>
      <rect x="6"  y="16" width="2" height="2" fill="#bfe9f7"/><rect x="18" y="22" width="2" height="2" fill="#bfe9f7"/>
      <rect x="33" y="10" width="2" height="2" fill="#bfe9f7"/><rect x="33" y="16" width="2" height="2" fill="#bfe9f7"/>
      <rect x="46" y="20" width="2" height="2" fill="#bfe9f7"/>
    </svg>
  </div>

  <!-- 地面：滿版綠帶，內容置中在上面 -->
  <div class="band">
    <div class="col">
      <h1 class="wordmark">ELEVATOR INC.</h1>
      <p class="tag" data-i18n="landTagline"></p>
      <p class="save" id="saveLine"></p>

      <nav class="menu">
        <button class="big" id="btnStart"></button>
        <div class="menuRow">
          <button id="btnRules" data-i18n="btnRules"></button>
          <button id="btnLedger" data-i18n="btnLedger"></button>
          <!-- 圖鑑頁（#149）。是 <a> 不是 <button>：另外三個都開浮層，這個是換頁，
               分不出來的話玩家會以為按了沒反應。它跟「更多遊戲」同一種東西。 -->
          <a class="codex" href="codex.html" data-i18n="btnCodex"></a>
          <a class="more" href="https://games.csiesheep.com/" data-i18n="btnMore"></a>
        </div>
      </nav>

      <footer class="foot">
        <a href="https://github.com/csiesheep/elevator_inc">GitHub</a>
      </footer>
    </div>
  </div>
</main>

<div id="sheetHost"></div>
<script type="module" src="js/landing.js"></script>
</body>
</html>
